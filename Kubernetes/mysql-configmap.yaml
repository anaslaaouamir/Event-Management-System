apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-configmap
data:
  host: mysql

  client-db-name: client_db
  event-db-name: event_db
  reservation-db-name: reservation_db


  init.sql: |
    CREATE
    DATABASE IF NOT EXISTS client_db;
      CREATE
    DATABASE IF NOT EXISTS reservation_db;
      CREATE
    DATABASE IF NOT EXISTS event_db;

  


