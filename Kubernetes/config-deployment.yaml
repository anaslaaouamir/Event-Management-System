apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-deployment
spec:
  selector:
    matchLabels:
      app: config
  replicas: 1
  template:
    metadata:
      labels:
        app: config
    spec:
      containers:
        - name: config-service
          image: config-service:v1
          ports:
            - containerPort: 9999


---


apiVersion: v1
kind: Service
metadata:
  name: config-service
spec:
  selector:
    app: config
  ports:
    - port: 9999
      protocol: "TCP"
      targetPort: 9999
  type: NodePort




