apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
spec:
  selector:
    matchLabels:
      app: gateway-service
  replicas: 1
  template:
    metadata:
      labels:
        app: gateway-service
    spec:

      containers:
        - name: gateway-service
          image: gateway-service:v1
          ports:
            - containerPort: 8888
            




---


apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  selector:
    app: gateway-service
  ports:
    - port: 8888
      protocol: "TCP"
      targetPort: 8888
  type: NodePort     




