apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-deployment
spec:
  selector:
    matchLabels:
      app: event-service
  replicas: 1
  template:
    metadata:
      labels:
        app: event-service
    spec:

      containers:
        - name: event-service
          image: event-service:v1
          ports:
            - containerPort: 9092
          env:
          
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
          
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: mysql-configmap
                  key: host
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: mysql-configmap
                  key: event-db-name
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: password



---


apiVersion: v1
kind: Service
metadata:
  name: event-service
spec:
  selector:
    app: event-service
  ports:
    - port: 9092
      protocol: "TCP"
      targetPort: 9092
  type: NodePort




