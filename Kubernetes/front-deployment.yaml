  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: client-deployment
  spec:
    selector:
      matchLabels:
        app: client-service
    replicas: 1
    template:
      metadata:
        labels:
          app: client-service
      spec:

        containers:
          - name: client-service
            image: client-service:v1
            ports:
              - containerPort: 9091
            env:
              - name: DB_HOST
                valueFrom:
                  configMapKeyRef:
                    name: mysql-configmap
                    key: host
              - name: DB_NAME
                valueFrom:
                  configMapKeyRef:
                    name: mysql-configmap
                    key: client-db-name
              - name: DB_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: mysql-secret
                    key: username
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: mysql-secret
                    key: password



  ---


  apiVersion: v1
  kind: Service
  metadata:
    name: client-service
  spec:
    selector:
      app: client-service
    ports:
      - port: 9091
        protocol: "TCP"
        targetPort: 9091
    type: NodePort




