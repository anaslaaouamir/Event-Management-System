apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-deployment
spec:
  selector:
    matchLabels:
      app: discovery
  replicas: 1
  template:
    metadata:
      labels:
        app: discovery
    spec:
      containers:
        - name: discovery-service 
          image: discovery-service:v1
          ports:
            - containerPort: 8761


---


apiVersion: v1
kind: Service
metadata:
  name: discovery-service
spec:
  selector:
    app: discovery
  ports:
    - port: 8761
      protocol: "TCP"
      targetPort: 8761
  type: NodePort




